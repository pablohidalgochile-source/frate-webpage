<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tu vaso · FRATEWEEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--rojo:#E8363D;--muted:#8b8b93;--border:rgba(255,255,255,.1);--dorado:#E6C860}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#f4f4f5;font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.marca{position:fixed;inset:0;opacity:.05;color:var(--rojo);font-family:'Anton',sans-serif;font-size:3.2rem;line-height:1.12;letter-spacing:2px;pointer-events:none;overflow:hidden;z-index:0;user-select:none}
.z{position:relative;z-index:1}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 70px}
.logo{display:block;margin:0 auto 20px;height:40px;opacity:.95}
.kicker{font-size:.6rem;letter-spacing:4px;text-transform:uppercase;color:var(--rojo);text-align:center}
.tit{font-family:'Anton',sans-serif;font-size:clamp(2.5rem,11vw,3.9rem);line-height:.9;color:#fff;text-align:center;letter-spacing:1px;margin-top:9px;text-shadow:0 2px 34px rgba(232,54,61,.35)}
.tit em{color:var(--rojo);font-style:normal;display:block}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin-top:14px;line-height:1.6}
.hero{width:100%;border-radius:16px;margin-top:22px;display:block;border:1px solid var(--border)}
.cols{display:flex;justify-content:center;gap:8px;margin-top:12px}
.col{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;border-radius:999px;padding:4px 13px;border:1px solid var(--border);color:var(--muted)}
.sect{font-size:.6rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.sect::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:rgba(18,18,21,.72);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:11px;transition:.2s}
.card.on{border-color:rgba(232,54,61,.55)}
.noche{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.15rem;text-transform:uppercase;color:#fff;line-height:1.1}
.fec{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--rojo);margin-bottom:3px}
.desc{color:var(--muted);font-size:.79rem;line-height:1.55;margin-top:7px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid var(--border)}
.precio{font-family:'Anton',sans-serif;font-size:1.75rem;color:var(--dorado);line-height:1}
.chico{font-size:.68rem;color:#6b6b73;margin-top:3px}
.qty{display:flex;align-items:center;gap:10px;flex-shrink:0}
.qb{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:#fff;font-size:1.2rem;cursor:pointer;transition:.15s}
.qb:hover:not(:disabled){border-color:var(--rojo);color:var(--rojo)}
.qb:disabled{opacity:.25;cursor:not-allowed}
.qn{font-family:'Anton',sans-serif;min-width:26px;text-align:center;font-size:1.4rem}
.cupo{font-size:.7rem;color:#6b6b73;margin-top:10px}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
.tot .lb{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-size:.84rem}
.tot .vl{font-family:'Anton',sans-serif;font-size:1.9rem;color:#fff}
.btn{width:100%;background:var(--rojo);color:#fff;border:none;border-radius:13px;padding:18px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.15rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:16px;box-shadow:0 8px 28px rgba(232,54,61,.3);transition:.18s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 34px rgba(232,54,61,.42)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.seguro{text-align:center;font-size:.7rem;color:#6b6b73;margin-top:11px}
.err{background:rgba(232,54,61,.12);border:1px solid rgba(232,54,61,.45);color:#f8b4b7;border-radius:10px;padding:12px 14px;font-size:.84rem;margin-top:13px;display:none;line-height:1.5}
.err.on{display:block}
.vacio{text-align:center;color:var(--muted);padding:42px 10px;line-height:1.8;font-size:.9rem}
a{color:var(--rojo);text-decoration:none}
.pie{text-align:center;margin-top:34px;font-size:.68rem;color:#4a4a52;line-height:1.7}
</style></head><body>
<div class="marca" id="marca"></div>
<div class="wrap z">
  <img class="logo" src="/assets/logo-blanco.png" alt="FRATE" onerror="this.style.display='none'">
  <div class="kicker">Frateween 2026</div>
  <h1 class="tit">Tu vaso<em>coleccionable</em></h1>
  <p class="sub" id="sub">Un momento…</p>
  <img class="hero" id="hero" alt="Vaso coleccionable Frateween en blanco, rojo y negro" style="display:none">
  <div class="cols" id="cols" style="display:none">
    <span class="col">333 blancos</span><span class="col">333 rojos</span><span class="col">333 negros</span>
  </div>
  <div id="cont"></div>
  <div class="err" id="err"></div>
  <div class="pie">Fraternidad Campus Central · <a href="https://frate.cl">frate.cl</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script>
// Página del enlace firmado: quien YA compró su entrada suma su vaso.
// No hay login ni formulario: el enlace del correo ya dice quién es, y la
// identidad la verifica el servidor (HMAC), nunca esta página.
const SUPABASE_URL='https://ydwlpraoaaijlfssevoh.supabase.co';
const SUPABASE_ANON='sb_publishable_-_7GeDU_h84zf2v--lWQaQ_15ZFxOWt';
const FOTO='https://ydwlpraoaaijlfssevoh.supabase.co/storage/v1/object/public/frate-media/mail/vaso-frateween.jpg';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search);
const EMAIL=(P.get('e')||'').trim(), TOKEN=(P.get('t')||'').trim();
const clp=n=>'$'+Number(n||0).toLocaleString('es-CL');
let NOCHES=[], sel={}, COM=0.08, NOMBRE='';

// Marca de agua repetida, igual que la página de temporada.
(function(){ const m=document.getElementById('marca'); let t=''; for(let i=0;i<60;i++) t+='FRATEWEEN · '; m.textContent=t.repeat(3); })();

function err(m){ const e=$('#err'); e.textContent=m; e.classList.add('on'); }

function pinta(){
  if(!NOCHES.length){
    $('#sub').textContent='';
    $('#cont').innerHTML='<div class="vacio">Este enlace ya no sirve, o no encontramos tu compra.<br><br>Si crees que es un error, escríbenos por WhatsApp.<br><br><a href="https://frate.cl">← Ir a frate.cl</a></div>';
    return;
  }
  $('#hero').src=FOTO; $('#hero').style.display='block';
  $('#cols').style.display='flex';
  const nom=(NOMBRE||'').split(' ')[0];
  $('#sub').innerHTML=(nom?('Hola <b style="color:#fff">'+nom+'</b>. '):'')+'Ya tienes tu entrada, así que puedes llevarte uno antes de que salgan a la venta.';
  $('#cont').innerHTML='<div class="sect">Elige tu vaso</div>' + NOCHES.map(n=>{
    const q=sel[n.addon.id]||0, sin=n.puede<=0;
    return `<div class="card ${q?'on':''}">
      <div class="fec">${n.fecha}</div>
      <div class="noche">${n.nombre}</div>
      <div class="desc">${n.addon.descripcion||''}</div>
      <div class="fila">
        <div>
          <div class="precio">${clp(n.addon.precio)}</div>
          <div class="chico">Con el recargo queda en ${clp(Math.round(n.addon.precio*(1+COM)))}</div>
        </div>
        <div class="qty">
          <button class="qb" ${q<=0?'disabled':''} onclick="chg(${n.addon.id},-1)">−</button>
          <span class="qn">${q}</span>
          <button class="qb" ${(sin||q>=n.puede)?'disabled':''} onclick="chg(${n.addon.id},1)">+</button>
        </div>
      </div>
      <div class="cupo">${sin
        ? (n.agotado?'Se agotaron.':'Ya llevaste los que te tocaban para esta noche.')
        : ('Tienes '+n.entradas+' entrada'+(n.entradas===1?'':'s')+' · puedes llevar hasta '+n.puede)}</div>
    </div>`;
  }).join('') + resumen();
}

function resumen(){
  let sub=0,u=0;
  NOCHES.forEach(n=>{ const q=sel[n.addon.id]||0; sub+=q*n.addon.precio; u+=q; });
  const tot=sub+Math.round(sub*COM);
  return `<div class="tot"><span class="lb">${u} vaso${u===1?'':'s'}</span><span class="vl">${clp(tot)}</span></div>
    <button class="btn" id="pagar" ${u<=0?'disabled':''} onclick="pagar()">${u<=0?'Elige al menos uno':'Quiero mi vaso'}</button>
    <div class="seguro">Pago seguro con MercadoPago · se retira en la barra esa noche</div>`;
}

function chg(id,d){
  const n=NOCHES.find(x=>x.addon.id===id); if(!n) return;
  sel[id]=Math.max(0,Math.min((sel[id]||0)+d,n.puede));
  pinta();
}

async function pagar(){
  $('#err').classList.remove('on');
  const btn=$('#pagar'); btn.disabled=true; btn.textContent='Abriendo el pago…';
  try{
    const items=[];
    NOCHES.forEach(n=>{ const q=sel[n.addon.id]||0; if(q>0) items.push({
      tipo:'merch', productoId:n.addon.id, nombre:n.addon.nombre,
      precio:n.addon.precio, cantidad:q, eventoId:n.evento_id }); });
    if(!items.length) throw new Error('Elige al menos un vaso.');
    const { data, error } = await sb.functions.invoke('crear-pago', {
      body:{ items, comprador:{ nombre:NOMBRE||'Cliente', email:EMAIL }, vaso:{ e:EMAIL, t:TOKEN } }
    });
    if(error){
      let m='No se pudo iniciar el pago';
      try{ const c=await error.context?.json?.(); if(c?.error) m=c.error; }catch(_){}
      throw new Error(m);
    }
    // El campo se llama `initPoint` (así lo devuelve crear-pago y así lo usa
    // comprar.html). Un pedido de $0 no pasa por MercadoPago.
    if(data&&data.freeOrder){ location.href='/pago-exitoso.html?external_reference='+data.pedidoId; return; }
    if(!data||!data.initPoint) throw new Error('MercadoPago no devolvió link de pago.');
    location.href=data.initPoint;
  }catch(e){
    err(e.message||'Algo falló.');
    const b=$('#pagar'); if(b){ b.disabled=false; b.textContent='Quiero mi vaso'; }
  }
}

(async function(){
  if(!EMAIL||!TOKEN){ NOCHES=[]; pinta(); return; }
  try{
    const { data: c } = await sb.from('config_valores').select('valor').eq('clave','comision_pct').maybeSingle();
    const n=parseFloat(c&&c.valor); if(!isNaN(n)&&n>=0&&n<=30) COM=n/100;
  }catch(_){}
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/mi-vaso?e='+encodeURIComponent(EMAIL)+'&t='+encodeURIComponent(TOKEN),{headers:{apikey:SUPABASE_ANON}});
    if(!r.ok){ NOCHES=[]; pinta(); return; }
    const j=await r.json();
    NOMBRE=j.nombre||'';
    NOCHES=(j.noches||[]).filter(n=>n&&n.addon);
  }catch(_){ NOCHES=[]; }
  pinta();
})();
</script>
</body></html>
