<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comprar entradas · FRATE</title>
<!-- Previsualización al compartir. Sin esto, un link de frate.cl en
     WhatsApp o Instagram sale sin imagen y parece spam. -->
<meta property="og:type" content="website" />

<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<style>
:root{--bg:#050506;--bg2:#0d0d0f;--bg3:#18181b;--border:#1c1c1f;--border2:#2b2b30;--text:#f4f4f5;--muted:#8b8b93;--rojo:#E8363D;--dorado:#D4A832;--verde:#22c55e;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;}
.wrap{max-width:520px;margin:0 auto;}
.hgrid{position:relative;z-index:2;display:flex;align-items:stretch;min-height:190px;}
.hizq{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:30px 16px 15px;min-width:0;}
/* 66% y no 100%: llenando todo el ancho el título se comía la portada y
   la decoración de atrás no se veía. */
.htit{width:66%;min-width:200px;}
.evsub{font-size:0.66rem;letter-spacing:2px;color:#c9c9d1;margin-top:11px;font-weight:600;}
.hero{position:relative;min-height:190px;display:flex;align-items:flex-end;overflow:hidden;}
.hero video,.hero .heroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,6,.35),var(--bg) 96%);}
.hero .grad{position:absolute;inset:0;background:linear-gradient(150deg,#3a1c5e,#8b1a3a);}
.hero-in{position:relative;padding:16px;width:100%;}
.hero .url{position:absolute;top:12px;left:16px;font-size:0.5rem;letter-spacing:2px;color:rgba(255,255,255,.7);text-transform:uppercase;}
.datetile{position:absolute;top:12px;right:14px;background:var(--rojo);color:#fff;border-radius:13px;text-align:center;padding:10px 15px;box-shadow:0 8px 26px rgba(232,54,61,.5);z-index:3;}
.datetile .dow{font-size:0.66rem;letter-spacing:2.5px;font-weight:800;}
.datetile .day{font-size:2.9rem;font-weight:900;line-height:.92;margin:2px 0;font-family:var(--disp,inherit);}
.datetile .mon{font-size:0.66rem;letter-spacing:2.5px;font-weight:800;}
.datetile .hh{font-size:0.6rem;letter-spacing:1.5px;opacity:.9;border-top:1px solid rgba(255,255,255,.32);margin-top:5px;padding-top:4px;}
.evname{font-weight:800;font-size:1.5rem;letter-spacing:1px;text-transform:uppercase;line-height:1;}
.evsub{font-size:0.66rem;letter-spacing:1.5px;color:#e4e4e7;margin-top:4px;text-transform:uppercase;}
.body{padding:16px 16px 40px;}
.lbl{font-size:0.55rem;letter-spacing:3px;color:#52525b;text-transform:uppercase;margin:16px 0 8px;}
/* Tarjetas de entrada (mismo look que la web, modo express) */
.ttc{position:relative;background:#0d0d10;border:1px solid var(--border2);border-radius:12px;padding:12px 13px 12px 17px;margin-bottom:10px;overflow:hidden;}
.ttc.agot{opacity:.55;}
/* La decoración va detrás de TODO el contenido de la tarjeta, y el velo
   tapa solo la izquierda para que el mosaico se vea por la derecha. */
.tt-deco{position:absolute;inset:0;z-index:0;}
.tt-deco::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,13,.92) 46%,rgba(10,10,13,.5));}
.tt-franja{position:absolute;left:0;top:0;bottom:0;width:5px;z-index:2;}
.tt-rot{font-size:0.6rem;letter-spacing:2.5px;font-weight:900;margin-bottom:3px;}
.tt-head{position:relative;z-index:1;display:flex;align-items:flex-start;gap:8px;}
.tt-title{flex:1;min-width:0;font-weight:800;font-size:1.02rem;letter-spacing:.3px;line-height:1.12;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.75);}
.ttc .tt-details,.ttc .tt-foot{position:relative;z-index:1;}
.tt-pub{font-weight:700;font-size:0.5rem;letter-spacing:.3px;vertical-align:middle;padding:1px 6px;border-radius:20px;white-space:nowrap;}
.tt-status{flex-shrink:0;font-size:0.52rem;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid;font-weight:700;white-space:nowrap;}
.tt-more{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid var(--border2);color:#c7c7cd;font-size:0.62rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px;border-radius:20px;cursor:pointer;}
.tt-chev{font-size:0.85rem;transition:transform .2s;}
.ttc.open .tt-more{border-color:var(--dorado);color:var(--dorado);}
.ttc.open .tt-chev{transform:rotate(180deg);}
.tt-details{display:none;margin:8px 0 0;padding:8px 10px;background:rgba(212,168,50,0.06);border:1px solid rgba(212,168,50,0.2);border-radius:6px;font-size:0.72rem;color:#d4d4d8;line-height:1.5;}
.ttc.open .tt-details{display:block;}
.tt-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:10px;}
.tt-price{font-weight:900;font-size:1.5rem;color:var(--dorado);letter-spacing:.5px;}
.tt-pocas{font-size:0.68rem;color:#f59e0b;margin-top:7px;font-weight:700;}
.tk{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border);}
.tk-i{flex:1;min-width:0;}.tk-n{font-weight:600;font-size:0.9rem;letter-spacing:.3px;}.tk-p{font-size:0.76rem;color:var(--dorado);letter-spacing:1px;margin-top:2px;}
.step{display:flex;align-items:center;gap:12px;}
.step button{width:30px;height:30px;border:1px solid var(--border2);background:transparent;color:var(--text);border-radius:6px;font-size:1.1rem;cursor:pointer;}
.step button.plus{border-color:var(--rojo);color:var(--rojo);}
.step b{min-width:16px;text-align:center;}
.att{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 11px;margin:8px 0;}
.att-h{font-size:0.6rem;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:7px;}
input,.inp{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 11px;border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:7px;}
input:focus{outline:none;border-color:var(--rojo);}
.row2{display:flex;gap:7px;}.row2>*{flex:1;}
.addon{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border);}
.addon .ck{width:19px;height:19px;border-radius:4px;border:1px solid var(--border2);flex-shrink:0;text-align:center;line-height:17px;font-size:0.66rem;color:#fff;}
.addon.on .ck{background:var(--rojo);border-color:var(--rojo);}
.addon .an{flex:1;font-size:0.82rem;}.addon .ad{font-size:0.66rem;color:var(--muted);}
.addon .qb{width:27px;height:27px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text);font-size:0.95rem;line-height:1;cursor:pointer;}
.addon .qb:disabled{opacity:.3;cursor:default;}
.addon .ap{color:var(--dorado);font-size:0.78rem;font-weight:600;}
.totrow{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 13px;border-top:1px solid var(--border);margin-top:8px;}
.totrow .tl{color:var(--muted);font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;}
.totrow .tv{font-size:1.35rem;font-weight:800;letter-spacing:1px;}
.pay{width:100%;background:var(--rojo);color:#fff;border:0;font-weight:700;letter-spacing:2px;padding:15px;border-radius:8px;font-size:0.85rem;text-transform:uppercase;cursor:pointer;font-family:inherit;}
.pay:disabled{opacity:.5;}
.note{text-align:center;font-size:0.55rem;letter-spacing:1.5px;color:#52525b;margin-top:10px;text-transform:uppercase;}
.msg{color:var(--rojo);font-size:0.8rem;text-align:center;margin-top:10px;min-height:18px;}
.center{text-align:center;padding:60px 20px;color:var(--muted);}
a.back{display:inline-block;margin:16px;color:var(--muted);font-size:0.7rem;letter-spacing:1px;text-decoration:none;text-transform:uppercase;}
</style></head>
<body>
<div class="wrap" id="app"><div class="center">Cargando…</div></div>
<script src="/frate-email.js"></script>
<script>
const sb = window.supabase.createClient('https://ydwlpraoaaijlfssevoh.supabase.co','sb_publishable_-_7GeDU_h84zf2v--lWQaQ_15ZFxOWt');
// ¿Hay sesión? Hace falta para las entradas solo para miembros.
window._ses=null; sb.auth.getSession().then(r=>{ window._ses=(r&&r.data&&r.data.session)||null; try{ _avisoCuenta(); }catch(_){} }).catch(()=>{});
const $=id=>document.getElementById(id);
const clp=n=>'$'+Number(n||0).toLocaleString('es-CL');
// RUT chileno: limpiar, formatear (12.345.678-9) y validar dígito verificador
function _rutClean(r){ return String(r||'').replace(/[^0-9kK]/g,'').toUpperCase(); }
function _rutFmt(r){ const c=_rutClean(r); if(c.length<2) return c; const dv=c.slice(-1), num=c.slice(0,-1); return num.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dv; }
function _rutOk(r){ const c=_rutClean(r); if(c.length<7||c.length>9) return false; const dv=c.slice(-1), num=c.slice(0,-1); let s=0,m=2; for(let i=num.length-1;i>=0;i--){ s+=parseInt(num[i],10)*m; m=m<7?m+1:2; } const res=11-(s%11); const calc=res===11?'0':res===10?'K':String(res); return calc===dv; }
const DOW=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'], MON=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function parseFecha(f){ if(!f) return null; const [y,m,d]=String(f).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
let EV=null, TKS=[], ADDONS=[], sel={}, addonSel={}, att={};
let TKS_TODOS=[];
let COM=0.04;  // comisión (se lee de config_valores.comision_pct)
let RETPCT=10; // retención en devoluciones (config_valores.devolucion_retencion_pct)

const params = new URLSearchParams(location.search);
// 🏷️ La etiqueta que ve el cliente (PREV 3 MUJER… → MUJER… · PREVENTA 3).
// El nombre real no se toca: vive en frate-afiche.js, acá sólo se pinta.
const _etq = n => (window.FrateAfiche && FrateAfiche.etiquetaPublica) ? FrateAfiche.etiquetaPublica(n) : (n||'');
const slug = (location.pathname.match(/\/e\/([^\/?#]+)/)||[])[1] || params.get('e') || params.get('ev');

async function findEvento(key){
  // 1) por slug (si la columna ya existe)
  try{ const { data, error } = await sb.from('eventos').select('*').ilike('slug', key).limit(1); if(!error && data && data[0]) return data[0]; }catch(_){}
  // 2) fallback por id numérico (sirve antes de correr el SQL del slug)
  if(/^\d+$/.test(String(key))){ try{ const { data } = await sb.from('eventos').select('*').eq('id', Number(key)).limit(1); if(data && data[0]) return data[0]; }catch(_){} }
  return null;
}
async function boot(){
  // El modo de color y la paleta salen de Configuración General. Si falla,
  // se queda con el automático y la paleta fluor.
  try{ if(window.FrateAfiche) await FrateAfiche.cargarConfig(sb); }catch(e){}
  if(!slug){ $('app').innerHTML='<div class="center">Link inválido.<br><a class="back" href="/">← Ir a frate.cl</a></div>'; return; }
  try{
    EV = await findEvento(slug);
    if(!EV){ $('app').innerHTML='<div class="center">No encontramos este evento.<br><a class="back" href="/">← Ver todos los eventos</a></div>'; return; }
    const estado = EV.estado || (EV.activo?'publicado':'creado');
    // Solo se vende si está publicado o en vivo. Cerrado / planificación / postedición / archivado → NO.
    if(!['publicado','en_vivo'].includes(estado) || EV.archivado){
      const yaCerro = (estado==='cerrado' || estado==='postedicion' || EV.archivado);
      $('app').innerHTML='<div class="center">'+(yaCerro?'Este evento ya no está a la venta.':'Este evento aún no está a la venta.')+'<br><a class="back" href="/">← Ver todos los eventos</a></div>'; return;
    }
    const [tks, { data:ads }, { data:comRow }, { data:retRow }] = await Promise.all([
      (async()=>{ let r=await sb.from('tipos_ticket').select('*').eq('evento_id',EV.id).order('orden').order('id'); if(r.error) r=await sb.from('tipos_ticket').select('*').eq('evento_id',EV.id).order('id'); return r.data||[]; })(),
      // 🥤 Extras de ESTE evento. `eventos` null = de siempre (todos). Con la lista
      //    puesta, el extra solo existe en esas noches — es lo que faltaba el 10-oct,
      //    cuando el transporte aparecia en todos los eventos a la vez.
      //    Desde el 20-oct el extra NO vive en `addons` sino en `tiendita`: un solo
      //    producto, un solo stock, y la configuración del producto dice por qué
      //    puertas se vende. Acá se pide la puerta `en_checkout`.
      sb.from('tiendita').select('id,nombre,descripcion,precio,stock,eventos,max_por_entrada,imagen_url,emoji')
        .eq('disponible',true).eq('en_checkout',true)
        .or('eventos.is.null,eventos.cs.{'+EV.id+'}').order('orden'),
      sb.from('config_valores').select('valor').eq('clave','comision_pct').maybeSingle(),
      sb.from('config_valores').select('valor').eq('clave','devolucion_retencion_pct').maybeSingle()
    ]);
    { const n=parseFloat(comRow&&comRow.valor); if(!isNaN(n)&&n>=0&&n<=30) COM=n/100; }
    { const r=parseFloat(retRow&&retRow.valor); if(!isNaN(r)&&r>=0&&r<=100) RETPCT=r; }
    // Se muestran los vendibles + los "Agotado" (aparecen gris). Ocultos/Cerrados no.
    // ⏳ Tramos de preventa: sólo el que está en su ventana AHORA. Instantes absolutos,
    //    se comparan con new Date(). Sin ventana → se vende siempre, como antes.
    const _ahoraV=new Date();
    const _enVentana=t=>{ const d=t.venta_desde?new Date(t.venta_desde):null, h=t.venta_hasta?new Date(t.venta_hasta):null;
                          if(d&&!isNaN(+d)&&_ahoraV<d) return false; if(h&&!isNaN(+h)&&_ahoraV>=h) return false; return true; };
    // ⚠️ TKS va filtrado por ventana, así que NO sirve para saber si la familia
    //    se quedó sin nada: un tramo que abre mañana no está acá y parecería que
    //    no queda nada. Para eso se guarda la lista completa.
    TKS_TODOS = (tks||[]);
    TKS = (tks||[]).filter(t=>['Activo','Solo venta WEB','Venta solo RRPP','Agotado'].includes(t.estado) && (t.solo_web!==false) && _enVentana(t));
    ADDONS = ads||[];
    render();
  }catch(e){ $('app').innerHTML='<div class="center">Error al cargar. Intenta de nuevo.<br><a class="back" href="/">← Ir a frate.cl</a></div>'; }
}
function heroBg(){
  // El orden (video → foto/flyer → decoración) lo resuelve frate-afiche.js,
  // uno solo para las tres portadas: si cada pantalla lo decidiera por su
  // cuenta, el mismo evento se vería distinto en cada una.
  try{ if(window.FrateAfiche) return FrateAfiche.fondoHTML(EV,{clase:'heroimg',w:620,h:250}); }catch(e){}
  if(EV.video_url) return `<video autoplay muted loop playsinline class="heroimg" src="${EV.video_url}"></video><div class="scrim"></div>`;
  if(EV.imagen_url) return `<img class="heroimg" src="${EV.imagen_url}" alt=""><div class="scrim"></div>`;
  return `<div class="grad"></div><div class="scrim"></div>`;
}
function render(){
  const d=parseFecha(EV.fecha);
  // La fecha la arma frate-afiche.js con sus estilos adentro: la usan tres
  // páginas y no quiero el mismo bloque de CSS copiado en cada una.
  const dt = (window.FrateAfiche ? FrateAfiche.fechaHTML(EV) : '');
  const sub = d?`${DOWL[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()].toLowerCase()} · ${EV.hora||'23:00'} – ${EV.hora_termino||'05:00'} hrs`:'';
  const tw = window.FrateAfiche ? FrateAfiche.titulo(EV.nombre||'FRATE')
           : `<div class="evname">${(EV.nombre||'').replace(/</g,'&lt;')}</div>`;
  let html = `<div class="hero">${heroBg()}
    <div class="url">frate.cl/e/${EV.slug||''}</div>
    <div class="hgrid"><div class="hizq"><div class="htit">${tw}</div><div class="evsub">${sub}</div></div>${dt}</div>
  </div><div class="body">`;
  html += `<div class="lbl">Entradas</div><div id="tks"></div>`;
  html += `<div id="attn"></div>`;
  if(ADDONS.length){ html += `<div class="lbl">Extras — opcional</div><div id="ads"></div>`; }
  html += `<div class="lbl">Tus datos</div>
    <input id="b-nombre" data-fmt="nombre" placeholder="Nombre y apellido" autocomplete="name" />
    <div class="row2"><input id="b-email" type="email" placeholder="Correo (ahí llega el QR)" autocomplete="email" /><input id="b-tel" data-fmt="tel" placeholder="Teléfono" inputmode="tel" autocomplete="tel" /></div>
    <input id="b-email2" type="email" placeholder="Confirma tu correo (ahí llega tu QR)" autocomplete="off" />
    <div style="font-size:0.66rem;color:var(--muted);margin:2px 2px 4px;">🪪 El <b>RUT de cada asistente</b> se pide arriba (al elegir entradas). Es obligatorio y se verifica en la puerta.</div>`;
  html += `<div class="totrow"><span class="tl">Total</span><span class="tv" id="tot">$0</span></div>
    <div id="aviso-cuenta" style="display:none;background:#1c1710;border:1px solid #D4A832;border-radius:10px;padding:13px 14px;margin:4px 0 10px;text-align:center;">
      <div style="font-weight:800;color:#E6C860;">Esta entrada es solo para miembros</div>
      <div style="font-size:0.8rem;color:#d4d0c4;margin:4px 0 10px;line-height:1.45;">Crea tu cuenta gratis y vuelves directo acá con tu entrada elegida.</div>
      <button type="button" class="pay" style="margin:0;" onclick="_irACrearCuenta()">Crear mi cuenta</button>
      <button type="button" onclick="_irAEntrar()" style="background:none;border:0;color:#E6C860;font-size:0.8rem;margin-top:8px;cursor:pointer;text-decoration:underline;">Ya tengo cuenta</button>
    </div>
    <button class="pay" id="paybtn" onclick="pagar()">Pagar con MercadoPago</button>
    <div class="msg" id="msg"></div>
    <!-- Solo aparece al apretar pagar: le dice el plazo ANTES de irse a MercadoPago. -->
    <div id="aviso-plazo" style="display:none;background:#241d06;border:1px solid #e0b53b;border-radius:9px;padding:11px 13px;margin-top:9px;font-size:0.78rem;line-height:1.55;color:#f0e2b0;">
      ⏳ <b>Te guardamos tus entradas por 30 minutos.</b><br>
      Si no alcanzas a pagar, no pierdes nada: te mandamos un link para retomarla y las entradas vuelven a estar disponibles para todos.
    </div>
    <div class="note" id="nota-fee">Incluye 8% de servicio · Tu QR llega al correo al instante · <b>Tienes 30 min para pagar</b></div>
    <div class="note" style="margin-top:6px;opacity:.85;">Entradas nominativas. En caso de <b>devolución</b>, se retiene un <b>${RETPCT}%</b> por gastos de gestión y transacción (la comisión de MercadoPago no es reembolsable). Al pagar aceptas esta condición.</div>
    <div class="note" style="margin-top:6px;opacity:.85;">Al pagar aceptas los <a href="/terminos.html" target="_blank" style="color:#E6C860;text-decoration:underline;">términos y condiciones</a>.</div>
    <a class="back" href="/">← Ver todos los eventos</a></div>`;
  $('app').innerHTML = html;
  try{ const k='frate_sel_'+(EV&&EV.id), g=sessionStorage.getItem(k); if(g){ sessionStorage.removeItem(k); const o=JSON.parse(g)||{}; Object.keys(o).forEach(id=>{ if(TKS.some(t=>String(t.id)===String(id))) sel[id]=o[id]; }); } }catch(_){}
  renderTks(); renderAddons(); renderAttendees(); recalc();
  // Al volver de crear la cuenta con la entrada de miembro ya elegida: se lee
  // el perfil para que la fila salga a nombre de la cuenta desde el inicio.
  if(window.FratePerfil && TKS.some(t=>t.solo_miembros&&(sel[t.id]||0)>0)){
    sb.auth.getSession().then(r=>{ window._ses=(r&&r.data&&r.data.session)||null; return window._ses ? FratePerfil.leer() : null; })
      .then(()=>{ renderAttendees(); _avisoCuenta(); }).catch(()=>{});
  }

  if(b) b.innerHTML='<span style="flex:1;">Revisando si quedan cupos…</span>';
  try{
    const { data, error }=await sb.functions.invoke('reanudar-pago',{ body:{ pedidoId:p.id, medio:'mercadopago', email:p.email||'' } });
    if(error){
      let m=error.message||'No se pudo';
      try{ const c=await error.context?.json?.(); if(c?.error) m=c.error; }catch(_){}
      throw new Error(m);
    }
    if(data?.error) throw new Error(data.error);
    if(!data?.initPoint) throw new Error('No se pudo generar el pago');
    try{ localStorage.setItem('frate_pend', JSON.stringify({...p, expira:data.expiraEn||null})); }catch(_){}
    location.href=data.initPoint;
  }catch(e){
    const m=String(e.message||e);
    // El caso feo pero honesto: se agotó mientras dudaba.
    if(b) b.innerHTML=`<span style="flex:1;min-width:170px;line-height:1.45;color:#ffb4b4;">
      <b>${/agot|stock|cupo/i.test(m)?'😢 Se agotaron mientras lo pensabas':'No se pudo retomar'}</b><br>
      <span style="opacity:.8;">${m.replace(/[<>]/g,'')}</span></span>
      <a href="/" style="background:#E8363D;color:#fff;text-decoration:none;font-weight:800;padding:10px 17px;border-radius:8px;font-size:0.82rem;">Ver otras fechas</a>
      <button onclick="_pendCerrar()" style="background:transparent;border:1px solid #3a3a42;color:#83808C;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:0.78rem;">Cerrar</button>`;
  }
}
// Al volver a la pestaña también se revisa: el caso típico es apretar atrás en MercadoPago.
window.addEventListener('pageshow', _pendMirar);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) _pendMirar(); });

boot();
_pendMirar();
</script>
</body></html>
