<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago no completado — Frate</title>
  <meta name="theme-color" content="#0A0A0B" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0A0A0B; color:#fff; font-family:'Helvetica Neue',Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { max-width:440px; width:100%; text-align:center; }
    .logo { font-size:30px; font-weight:900; letter-spacing:8px; font-family:'Arial Black',sans-serif; margin-bottom:4px; }
    .sub { font-size:10px; color:#71717a; letter-spacing:4px; text-transform:uppercase; margin-bottom:40px; }
    .icon { width:88px; height:88px; border-radius:50%; background:#3f1517; border:2px solid #E8363D; display:flex; align-items:center; justify-content:center; margin:0 auto 28px; font-size:44px; }
    h1 { font-size:26px; font-weight:900; margin-bottom:14px; }
    p { color:#a1a1aa; font-size:15px; line-height:1.6; margin-bottom:12px; }
    .info { background:#1a1a1c; border-left:3px solid #E8363D; border-radius:4px; padding:14px 18px; text-align:left; margin:20px 0; font-size:13px; color:#d4d4d8; line-height:1.6; }
    .btn { display:inline-block; background:#E8363D; color:#fff; text-decoration:none; padding:15px 40px; font-weight:900; letter-spacing:3px; font-size:14px; text-transform:uppercase; border-radius:3px; margin-top:8px; }
    .btn-ghost { display:inline-block; color:#71717a; text-decoration:none; padding:12px; font-size:13px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FRATE</div>
    <div class="sub">Fraternidad Campus Central</div>

    <div class="icon">✕</div>
    <h1>Pago no completado</h1>
    <p>Tu pago no se pudo procesar o fue cancelado.</p>

    <div class="info">
      <strong style="color:#fff;">No te preocupes — no se realizó ningún cobro.</strong> Tus entradas no fueron reservadas. Puedes intentar de nuevo con otro medio de pago.
    </div>

    <a href="/" class="btn">VOLVER A INTENTAR</a><br>
    <a href="https://wa.me/56926104782" class="btn-ghost">¿Problemas? Escríbenos por WhatsApp →</a>
  </div>
</body>
</html>
