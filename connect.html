<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>FRATE WEB (TICKETERA) · CONNECT</title>
<link rel="manifest" href="/connect-manifest.json" />
<meta name="theme-color" content="#0c0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FRATE CONNECT" />
<link rel="apple-touch-icon" href="/icon-frate.svg" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/frate-supabase.js"></script>
<style>
  :root{
    --bg:#0c0c10; --panel:#15151b; --panel2:#1d1d25; --panel3:#26262f; --border:#2b2b35;
    --text:#ededf1; --muted:#8a8a95; --muted2:#63636d;
    --red:#e11d2a; --wa:#25d366; --web:#5b9dff; --ig:#e1306c; --gold:#e0b53b; --green:#3dff88;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;overflow:hidden}
  .disp{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea{font-family:inherit}
  .hide{display:none!important}

  /* Login */
  #login{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;gap:12px;background:radial-gradient(700px 360px at 50% 0,rgba(225,29,42,.14),transparent 60%),var(--bg)}
  #login .logo{font-size:30px;letter-spacing:1px}
  #login .sub{color:var(--muted);font-size:13px;text-align:center;max-width:280px;margin-bottom:8px}
  .fld{width:100%;max-width:320px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:12px;font-size:16px}
  .lbtn{width:100%;max-width:320px;background:var(--red);color:#fff;font-weight:800;padding:14px;border-radius:12px;font-size:16px}
  #l-err{color:#ff6b6b;font-size:13px;min-height:18px;text-align:center}

  /* App shell */
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0) + 12px) 14px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
  .topbar .b1{font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
  .topbar .bolt{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--red),#ff5a45);display:grid;place-items:center;font-size:14px}
  .icobtn{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:17px}

  /* Filters */
  .filters{padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .chip .n{margin-left:5px;opacity:.8}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:9px 12px}
  .search input{flex:1;background:none;border:0;color:var(--text);font-size:14px;outline:none}

  /* List */
  .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .conv{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
  .conv:active{background:var(--panel2)}
  .av{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;position:relative}
  .av .cb{position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;border:2px solid var(--panel);display:grid;place-items:center;font-size:10px;background:var(--panel3)}
  .cmain{flex:1;min-width:0}
  .crow1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .cname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctime{font-size:11px;color:var(--muted2);flex-shrink:0}
  .crow2{display:flex;align-items:center;gap:6px;margin-top:2px}
  .cprev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
  .empty{padding:50px 24px;text-align:center;color:var(--muted);font-size:14px}

  /* Thread */
  #thread{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;z-index:5}
  #thread.on{transform:translateX(0)}
  .thead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0) + 11px) 12px 11px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
  .thead .who{flex:1;min-width:0}
  .thead .who b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thead .who small{font-size:11px;color:var(--muted)}
  .tacts{display:flex;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
  .tacts::-webkit-scrollbar{display:none}
  .tbtn{flex:0 0 auto;font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--border);white-space:nowrap}
  .tbtn.wa{background:var(--wa);color:#083b1c;border-color:transparent}
  .tbtn.red{background:var(--red);color:#fff;border-color:transparent}
  .body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 24px)}
  .bub{max-width:80%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;word-wrap:break-word}
  .them{align-self:flex-start;background:var(--panel3);border-bottom-left-radius:4px}
  .mine{align-self:flex-end;background:#16432a;border-bottom-right-radius:4px}
  .botb{align-self:flex-end;background:#2b2350;border-bottom-right-radius:4px}
  .bwho{font-size:10px;font-weight:800;opacity:.8;margin-bottom:2px}
  .bt{font-size:9.5px;color:rgba(255,255,255,.4);margin-top:3px;text-align:right}
  .bm{max-width:100%;border-radius:9px;margin-top:5px;display:block}
  .composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(env(safe-area-inset-bottom,0) + 10px);background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
  .composer textarea{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:10px 15px;font-size:15px;resize:none;max-height:110px;outline:none}
  .sendb{width:44px;height:44px;border-radius:50%;background:var(--wa);color:#083b1c;display:grid;place-items:center;font-size:19px;flex-shrink:0}
  .hint{font-size:11px;color:var(--muted);padding:0 14px 6px}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0) + 18px);transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:.25s;z-index:50;max-width:90%;text-align:center;border:1px solid var(--border)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#3a1414;border-color:var(--red)}
  .spin{padding:40px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="logo disp">⚡ FRATE CONNECT</div>
  <div class="sub">Tu bandeja única de mensajes — WhatsApp, web e Instagram. Solo equipo FRATE.</div>
  <input class="fld" id="l-email" type="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="correo" style="text-transform:lowercase;" />
  <input class="fld" id="l-pass" type="password" placeholder="contraseña" onkeydown="if(event.key==='Enter')entrar()" />
  <button class="lbtn" onclick="entrar()">Entrar</button>
  <div id="l-err"></div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="b1 disp"><span class="bolt">⚡</span> CONNECT</div>
    <div style="margin-left:auto;display:flex;gap:8px;">
      <button class="icobtn" onclick="cargar()" title="Refrescar">↻</button>
      <button class="icobtn" onclick="salir()" title="Salir">⏻</button>
    </div>
  </div>
  <div class="filters">
    <div class="chips" id="canal-chips"></div>
    <div class="chips" id="tray-chips"></div>
    <div class="search">🔍 <input id="q" placeholder="Buscar nombre, teléfono, @ig…" oninput="pintar()" /></div>
  </div>
  <div class="list" id="list"><div class="spin">Cargando…</div></div>
</div>

<!-- THREAD -->
<div id="thread">
  <div class="thead">
    <button class="icobtn" onclick="cerrarHilo()" style="background:none;">←</button>
    <div class="av" id="t-av" style="width:38px;height:38px;font-size:14px;"></div>
    <div class="who"><b id="t-name">—</b><small id="t-sub"></small></div>
  </div>
  <div class="tacts" id="t-acts"></div>
  <div class="body" id="t-body"></div>
  <div class="hint" id="t-hint"></div>
  <div class="composer">
    <textarea id="t-reply" rows="1" placeholder="Mensaje…" oninput="_grow(this)"></textarea>
    <button class="sendb" id="t-send" onclick="responder()">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let ME=null, ROL=null, CONV=[], CUR=null, POLL=null;
let FILT={ canal:'', tray:'esperan' };
const TRAYS=[['esperan','⏳ Te esperan',c=>c.estado==='esperando_humano'],['activas','💬 Activas',c=>c.estado==='humano'],['bot','🤖 Con bot',c=>(c.estado||'bot')==='bot'],['cerradas','✓ Cerradas',c=>c.estado==='cerrado']];
const CANALES=[['','Todos'],['whatsapp','🟢 WhatsApp'],['web','🌐 Web'],['instagram','📸 IG']];

function toast(t,err){ const el=$('#toast'); el.textContent=t; el.className='toast on'+(err?' err':''); setTimeout(()=>el.className='toast',2600); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _grow(t){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,110)+'px'; }
function fmtHora(t){ if(!t) return ''; const d=new Date(t); if(isNaN(d)) return ''; const h=new Date(); const sameDay=d.toDateString()===h.toDateString();
  return sameDay ? d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}); }
function nombre(c){ const ct=c.contacto||{}; return c.nombre||ct.nombre||(c.canal==='whatsapp'?'WhatsApp':c.canal==='instagram'?'Instagram':'Visitante web'); }
function tel(c){ return c.telefono||(c.contacto&&c.contacto.telefono)||''; }
function canalIcon(c){ const k=c.canal||'web'; return k==='whatsapp'?'🟢':k==='instagram'?'📸':'🌐'; }
function color(c){ const k=c.canal||'web'; return k==='whatsapp'?'#1f9d57':k==='instagram'?'#b23bd0':'#3b82f6'; }
function inicial(c){ const n=nombre(c).trim().replace(/^@/,''); const l=n.charAt(0).toUpperCase(); return /[A-Z0-9]/.test(l)?l:'💬'; }
function estadoDot(e){ return e==='esperando_humano'?'var(--gold)':e==='humano'?'var(--green)':e==='cerrado'?'var(--muted2)':'var(--web)'; }
function last(c){ const m=(c.mensajes||[]); return m.length?m[m.length-1]:null; }

// ── Auth ──
async function entrar(){
  const email=$('#l-email').value.trim().toLowerCase(), pass=$('#l-pass').value;
  $('#l-err').textContent='';
  if(!email||!pass){ $('#l-err').textContent='Completa correo y contraseña'; return; }
  try{
    const { error }=await sb.auth.signInWithPassword({ email, password:pass });
    if(error) throw error;
    await arrancar();
  }catch(e){ $('#l-err').textContent='No pudimos entrar. Revisa tus datos.'; }
}
async function salir(){ try{ if(POLL) clearInterval(POLL); await sb.auth.signOut(); }catch(e){} location.reload(); }
async function arrancar(){
  const { data:{ user } }=await sb.auth.getUser();
  if(!user){ return; }
  let rol=null, nombre='';
  try{ const r=await sb.from('clientes').select('rol,nombres,username').eq('id',user.id).maybeSingle(); rol=r.data&&r.data.rol; nombre=(r.data&&(r.data.nombres||r.data.username))||''; }catch(e){}
  if(!['rrpp','admin','portero'].includes(rol)){ $('#l-err').textContent='Tu cuenta no es del equipo. Pide que te habiliten.'; try{ await sb.auth.signOut(); }catch(e){} return; }
  ME=user.id; ROL=rol;
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  await cargar();
  if(POLL) clearInterval(POLL);
  POLL=setInterval(()=>{ cargar(true); if(CUR) abrir(CUR,true); }, 12000);
}

// ── Datos ──
async function cargar(silent){
  if(!silent){ const l=$('#list'); if(l&&!CONV.length) l.innerHTML='<div class="spin">Cargando…</div>'; }
  try{
    const { data, error }=await sb.from('conversaciones').select('*, mensajes(texto,rol,ts)').order('ultimo_ts',{ascending:false}).limit(200);
    if(error) throw error;
    CONV=data||[]; pintar();
  }catch(e){ const l=$('#list'); if(l&&!CONV.length) l.innerHTML='<div class="empty">No se pudo cargar. '+esc(e.message||e)+'</div>'; }
}
function pintar(){
  // chips de canal
  $('#canal-chips').innerHTML=CANALES.map(([k,l])=>`<button class="chip ${FILT.canal===k?'on':''}" onclick="FILT.canal='${k}';pintar()">${l}</button>`).join('');
  // chips de bandeja (con conteo respetando el canal)
  const base=FILT.canal?CONV.filter(c=>(c.canal||'web')===FILT.canal):CONV;
  $('#tray-chips').innerHTML=TRAYS.map(([k,l,m])=>`<button class="chip ${FILT.tray===k?'on':''}" onclick="FILT.tray='${k}';pintar()">${l}<span class="n">${base.filter(m).length}</span></button>`).join('');
  const tray=TRAYS.find(t=>t[0]===FILT.tray)||TRAYS[0];
  let arr=base.filter(tray[2]);
  const q=($('#q').value||'').toLowerCase().trim();
  if(q) arr=arr.filter(c=>{ const ct=c.contacto||{}; const lm=last(c); return [nombre(c),tel(c),ct.instagram,c.canal,lm&&lm.texto].filter(Boolean).join(' ').toLowerCase().includes(q); });
  const list=$('#list');
  if(!arr.length){ list.innerHTML=`<div class="empty">${q?'Nada que calce 🔍':'Nada en esta bandeja 🫧'}<br><span style="font-size:12px;color:var(--muted2)">Si esperas ver WhatsApp aquí, corre <b>frate-connect.sql</b>.</span></div>`; return; }
  list.innerHTML=arr.map(c=>{
    const lm=last(c); const prev=lm?((lm.rol!=='cliente'?'✓ ':'')+(lm.texto||'')):'sin mensajes';
    return `<div class="conv" onclick="abrir('${c.id}')">
      <div class="av" style="background:${color(c)}">${inicial(c)}<span class="cb">${canalIcon(c)}</span></div>
      <div class="cmain">
        <div class="crow1"><span class="cname">${esc(nombre(c))}</span><span class="ctime">${fmtHora(c.ultimo_ts||(lm&&lm.ts))}</span></div>
        <div class="crow2"><span class="dot" style="background:${estadoDot(c.estado)}"></span>${c.grupo?`<span class="tag" style="background:rgba(224,181,59,.16);color:var(--gold)">${esc(c.grupo)}</span>`:''}<span class="cprev">${esc(prev)}</span></div>
      </div>
    </div>`;
  }).join('');
}

// ── Hilo ──
async function abrir(id, silent){
  CUR=id;
  const c=CONV.find(x=>x.id===id); if(!c) return;
  if(!silent){ $('#thread').classList.add('on'); }
  $('#t-name').textContent=nombre(c);
  $('#t-sub').textContent=[canalIcon(c)+' '+(c.canal||'web'), tel(c)].filter(Boolean).join(' · ');
  const av=$('#t-av'); av.style.background=color(c); av.innerHTML=inicial(c)+`<span class="cb" style="width:15px;height:15px;font-size:8px;">${canalIcon(c)}</span>`;
  const mine=c.asignado_a && c.asignado_a===ME;
  $('#t-acts').innerHTML=`${mine?'':`<button class="tbtn wa" onclick="tomar('${id}')">✋ Tomar</button>`}<button class="tbtn" onclick="setEstado('${id}','bot')">🤖 Al bot</button><button class="tbtn red" onclick="setEstado('${id}','cerrado')">✓ Cerrar</button>`;
  try{
    const { data:msgs }=await sb.from('mensajes').select('*').eq('conversacion_id',id).order('ts');
    const body=$('#t-body');
    // Respeta tu scroll: solo baja al final si abriste el chat, o si ya estabas abajo.
    const wasBottom = body ? (body.scrollHeight - body.scrollTop - body.clientHeight < 80) : true;
    const oldScroll = body ? body.scrollTop : 0;
    body.innerHTML=(msgs||[]).map(m=>{
      const cls=m.rol==='cliente'?'them':m.rol==='humano'?'mine':'botb';
      const who=m.rol==='humano'?'👤 tú':m.rol==='bot'?'🍇 BOT FRIEND':'';
      const media=(m.media&&m.media.url)?`<img class="bm" src="${esc(m.media.url)}" alt="" />`:'';
      const del=m.id?`<span onclick="event.stopPropagation();borrarMsg(${m.id})" title="Quitar del inbox (no del teléfono del cliente)" style="cursor:pointer;opacity:.45;margin-left:7px;">🗑</span>`:'';
      return `<div class="bub ${cls}">${who?`<div class="bwho">${who}</div>`:''}${esc(m.texto)}${media}<div class="bt">${fmtHora(m.ts)}${del}</div></div>`;
    }).join('')||'<div class="empty">sin mensajes aún</div>';
    if(!silent || wasBottom) body.scrollTop=body.scrollHeight; else body.scrollTop=oldScroll;
  }catch(e){}
}
function cerrarHilo(){ $('#thread').classList.remove('on'); CUR=null; }
// 🗑 Quitar un mensaje del inbox (registro de FRATE) — NO del teléfono del cliente
async function borrarMsg(id){
  if(!confirm('¿Quitar este mensaje del inbox?\n\nOJO: se borra solo de tu registro en FRATE — NO del teléfono del cliente (WhatsApp no permite des-enviar).')) return;
  try{
    let wmid=null; try{ const {data}=await sb.from('mensajes').select('wsp_msg_id').eq('id',id).maybeSingle(); wmid=data&&data.wsp_msg_id; }catch(_){}
    const { error }=await sb.from('mensajes').delete().eq('id',id); if(error) throw error;
    if(wmid && !/@/.test(String(wmid))){ try{ await sb.from('wsp_mensajes').delete().eq('wa_message_id',wmid); }catch(_){} }
    toast('🗑 Quitado del inbox'); if(CUR) abrir(CUR,true); cargar(true);
  }catch(e){ toast('No se pudo: '+((e&&e.message)||e),true); }
}
async function responder(){
  const id=CUR; if(!id) return;
  const ta=$('#t-reply'); const texto=(ta.value||'').trim(); if(!texto) return;
  if(window._sending){ toast('Espera, se está enviando…',true); return; }   // anti-doble-envío
  window._sending=true;
  const c=CONV.find(x=>x.id===id); const canal=c?c.canal:'web';
  const hint=$('#t-hint'); hint.textContent='Enviando…';
  try{
    if(canal==='whatsapp'){
      const to=tel(c); if(!to){ toast('Sin número de WhatsApp',true); hint.textContent=''; return; }
      const { data, error }=await sb.functions.invoke('wsp-enviar',{ body:{ to, texto, conversacion_id:(c.wsp_id||undefined) } });
      if(error) throw new Error(error.message||'Error'); if(data&&data.error) throw new Error(data.error);
    }else{
      await sb.from('mensajes').insert({ conversacion_id:id, rol:'humano', texto });
    }
    await sb.from('conversaciones').update({ estado:'humano', asignado_a:ME, ultimo_ts:new Date().toISOString() }).eq('id',id);
    ta.value=''; _grow(ta); hint.textContent='';
    await abrir(id,true); cargar(true);
  }catch(e){ const m=String((e&&e.message)||e); hint.textContent='';
    if(/token|409|24 ?h|ventana|plantilla|WHATSAPP_TOKEN/i.test(m)) toast('WhatsApp no salió: '+m,true); else toast('Error: '+m,true);
  }finally{ window._sending=false; }
}
async function tomar(id){ try{ await sb.from('conversaciones').update({ estado:'humano', asignado_a:ME, ultimo_ts:new Date().toISOString() }).eq('id',id); toast('✋ Tomada'); await abrir(id,true); cargar(true); }catch(e){ toast('Error',true); } }
async function setEstado(id,estado){
  try{
    if(estado==='bot'){
      const c=CONV.find(x=>x.id===id);
      if(c&&c.canal==='whatsapp'&&c.wsp_id){ try{ await sb.from('wsp_conversaciones').update({ etapa:'bot_intake' }).eq('id',c.wsp_id); }catch(_){} }
      await sb.from('conversaciones').update({ estado:'bot', asignado_a:null, ultimo_ts:new Date().toISOString() }).eq('id',id);
      toast('🤖 Devuelta al bot');
    }else{
      await sb.from('conversaciones').update({ estado:'cerrado', ultimo_ts:new Date().toISOString() }).eq('id',id);
      toast('✓ Cerrada'); cerrarHilo();
    }
    cargar(true);
  }catch(e){ toast('Error',true); }
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('/connect-sw.js').catch(()=>{}); }
(async function(){ try{ const { data:{ session } }=await sb.auth.getSession(); if(session) await arrancar(); }catch(e){} })();
